name: CRM quality checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_TIMEZONE: Asia/Kolkata
      VITE_APP_TIMEZONE: Asia/Kolkata
      VITE_API_URL: /api
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            dashboard/package-lock.json
      - run: npm ci --prefix backend
      - run: npm ci --prefix dashboard
      - run: npm test --prefix backend
      # Includes isolated snapshot/restore drills, never a supplied application URI.
      - run: npm run test:integration --prefix backend
      - run: npm test --prefix dashboard
      - run: npm run lint --prefix dashboard
      - run: npm run test:routes --prefix dashboard
      - run: npm run build --prefix dashboard
  desktop-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            dashboard/package-lock.json
            desktop-app/package-lock.json
      - run: npm ci --prefix backend
      - run: npm ci --prefix dashboard
      - run: npm ci --prefix desktop-app
      - run: npm test --prefix desktop-app
      # This workflow never publishes, deploys, installs, or receives signing secrets.
