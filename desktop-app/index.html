<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src http://localhost:5000 http://127.0.0.1:5000 https:; img-src 'self' data:; style-src 'self'; script-src 'self'; form-action 'self'; frame-ancestors 'none'" />
    <link rel="stylesheet" href="./style.css" />
    <title>CRM - Sign in</title>
  </head>
  <body data-page="login">
    <main class="desktop-shell">
      <header class="app-header">
        <div class="brand-mark" aria-hidden="true">C</div>
        <div>
          <p class="app-eyebrow">EMPLOYEE TIME &amp; ATTENDANCE</p>
          <h1>CRM Desktop</h1>
        </div>
      </header>
      <section id="loginSection" class="login-view" aria-labelledby="login-title">
        <div class="login-card">
          <p class="section-eyebrow">WELCOME BACK</p>
          <h2 id="login-title">Sign in to your workspace</h2>
          <p class="login-copy">Manage your attendance and track your work in one place.</p>
          <section id="rememberedLogin" class="remembered-login" hidden aria-label="Remembered account">
            <div id="rememberedAvatar" class="remembered-avatar" aria-hidden="true">C</div>
            <div class="remembered-details"><strong id="rememberedName">Employee</strong><span id="rememberedEmail"></span></div>
            <button type="button" id="quickLoginButton">Continue</button>
            <button type="button" id="differentAccountButton" class="different-account-button">Use another account</button>
          </section>
          <form id="loginForm" novalidate>
            <div class="form-field">
              <label for="email">Work email</label>
              <input type="email" id="email" name="email" autocomplete="email" placeholder="name@company.com" required />
            </div>
            <div class="form-field">
              <label for="password">Password</label>
              <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Enter your password" required />
            </div>
            <button type="submit" id="loginButton">Login</button>
          </form>
          <p id="message" role="alert"></p>
        </div>
      </section>
      <footer id="appVersion" class="app-version" hidden></footer>
    </main>
    <script src="./renderer.js"></script>
  </body>
</html>
