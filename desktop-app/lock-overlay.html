<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'" />
    <title>CRM</title>
    <style>
      html, body { height:100%; margin:0; overflow:hidden; cursor:default; user-select:none; }
      body { display:flex; align-items:flex-end; justify-content:center; background:#0b1220; color:#8a97ad; font-family:"Segoe UI", Arial, sans-serif; }
      p { margin:0 0 7vh; padding:0 16px; font-size:14px; line-height:1.6; text-align:center; }
      strong { display:block; color:#d6deea; font-size:16px; }
    </style>
  </head>
  <body>
    <p><strong>Your timer is not running</strong>Start your timer in the CRM window to continue.</p>
  </body>
</html>
